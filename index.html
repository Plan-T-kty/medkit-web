<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F7A5A">
<meta name="color-scheme" content="light dark">
<title>선교약품</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="선교약품">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #F6F7F5;
  --surface: #FFFFFF;
  --surface-2: #EEF1EE;
  --ink: #17212B;
  --ink-2: #5A6471;
  --ink-3: #8B95A1;
  --line: #DCE1E5;
  --green: #0F7A5A;
  --green-ink: #0A5C44;
  --green-soft: #DFF2E9;
  --amber: #C66A14;
  --amber-ink: #8F4A0A;
  --amber-soft: #FBEBD6;
  --red: #B3261E;
  --red-soft: #FBE3E0;
  --blue: #1F5FA8;
  --blue-soft: #E1ECF9;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(23,33,43,.06), 0 6px 18px rgba(23,33,43,.06);
  --tabbar-h: 64px;
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121619;
    --surface: #1B2126;
    --surface-2: #232B31;
    --ink: #EEF2F4;
    --ink-2: #AAB4BE;
    --ink-3: #74808B;
    --line: #2E373E;
    --green: #35B588;
    --green-ink: #8FE0C0;
    --green-soft: #173A2F;
    --amber: #E8923C;
    --amber-ink: #F5C48F;
    --amber-soft: #3E2A14;
    --red: #F08A82;
    --red-soft: #4A1F1B;
    --blue: #7FB0F0;
    --blue-soft: #1D2E44;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; min-width: 0; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
input, select, textarea { max-width: 100%; }
body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app { min-height: 100%; }
.view { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--ink-3);
}
.tab .tab-ic { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .7; }
.tab.active { color: var(--ink); }
.tab.active .tab-ic { filter: none; opacity: 1; }
.tab[data-tab="drugs"].active { color: var(--green-ink); }
.tab[data-tab="bags"].active { color: var(--amber-ink); }

/* ---------- top bars ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.topbar-row { display: flex; align-items: center; gap: 8px; }
.topbar h1 { font-size: 22px; letter-spacing: -0.01em; }
.topbar .spacer { flex: 1; }
.searchbox {
  flex: 1; display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 0 8px 0 12px; height: 48px;
}
.searchbox input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; height: 100%;
}
.searchbox input::placeholder { color: var(--ink-3); }
.searchbox .clear { border: 0; background: var(--surface-2); color: var(--ink-2); width: 28px; height: 28px; border-radius: 50%; font-size: 14px; }
.iconbtn {
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); font-size: 22px; display: inline-flex; align-items: center; justify-content: center;
  flex: none;
}
.iconbtn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.iconbtn.amber { background: var(--amber); border-color: var(--amber); color: #fff; }
.iconbtn:active { transform: scale(.96); }

.subbar { display: flex; gap: 6px; align-items: center; padding: 8px 14px 0; overflow-x: auto; scrollbar-width: none; }
.subbar::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.warn.on { background: var(--red); border-color: var(--red); color: #fff; }

/* ---------- lists ---------- */
.list { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 8px; }
.group-h {
  position: sticky; top: calc(68px + env(safe-area-inset-top)); z-index: 5;
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 2px 4px; font-size: 13px; font-weight: 700; color: var(--ink-2);
  background: linear-gradient(var(--bg) 70%, transparent);
}
.group-h .cnt { color: var(--ink-3); font-weight: 600; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; text-align: left; width: 100%; display: block;
}
.card:active { background: var(--surface-2); }
.drug-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.drug-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.drug-sub { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.drug-total { text-align: right; }
.drug-total b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.drug-total small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.tag.form { background: var(--green-soft); color: var(--green-ink); }
.lots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
/* expiry stamp — the signature element */
.stamp {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--line); border-radius: 7px; padding: 3px 8px;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em;
  color: var(--ink-2); background: var(--surface);
}
.stamp .q { font-weight: 600; color: var(--ink-3); }
.stamp.soon { border-color: var(--amber); color: var(--amber-ink); background: var(--amber-soft); }
.stamp.urgent { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.stamp.expired { border-color: var(--red); color: #fff; background: var(--red); }
.stamp.none { border-style: dashed; }

.empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
.empty h2 { font-size: 19px; margin-bottom: 8px; color: var(--ink); }
.empty p { margin: 0 0 18px; }
.empty .actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

/* ---------- buttons ---------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px;
}
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.amber { background: var(--amber); border-color: var(--amber); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red); background: var(--surface); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.btn:active { transform: scale(.98); }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* ---------- search results ---------- */
.section-title { padding: 14px 16px 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.section-title .src { margin-left: auto; font-weight: 600; color: var(--ink-3); }
.result {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
}
.result .r-name { font-weight: 700; font-size: 16px; }
.result .r-sub { color: var(--ink-2); font-size: 13px; }
.result .r-side { text-align: right; color: var(--ink-3); font-size: 12px; font-weight: 600; }
.result.inv { border-left: 4px solid var(--green); }
.notice { margin: 8px 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.notice.err { background: var(--red-soft); color: var(--red); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--ink-2); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

/* ---------- sheets (bottom modals) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.sheet-wrap .scrim { position: absolute; inset: 0; background: rgba(10,14,18,.45); }
.sheet {
  position: relative; width: 100%; background: var(--surface); border-radius: 20px 20px 0 0;
  max-height: calc(100% - 24px - env(safe-area-inset-top)); display: flex; flex-direction: column;
  box-shadow: 0 -8px 30px rgba(0,0,0,.2);
  animation: up .22s ease-out;
}
.sheet.full { max-height: 100%; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top); }
.sheet-b { min-height: 0; }
.sheet-h, .sheet-f { flex: none; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.sheet-h h2 { font-size: 19px; flex: 1; letter-spacing: -0.01em; }
.sheet-h .x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; color: var(--ink-2); }
.sheet-b { overflow-y: auto; padding: 0 16px 16px; flex: 1; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; background: var(--surface); }
.sheet-f .btn { flex: 1; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
.field label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.field label .hint { font-weight: 500; color: var(--ink-3); }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 12px;
  font-size: 17px; min-height: 48px; outline: none; width: 100%;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.field.amber input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.field input.big { font-size: 24px; font-weight: 700; min-height: 56px; letter-spacing: .01em; }
.field .help { font-size: 13px; color: var(--ink-3); min-height: 18px; }
.field .help.ok { color: var(--green-ink); font-weight: 600; }
.field .help.bad { color: var(--red); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0 8px; align-items: end; }
.grid-3 .times { padding-bottom: 22px; font-size: 20px; color: var(--ink-3); text-align: center; }
.total-line { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 2px; }
.total-line b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.total-line span { color: var(--ink-2); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip.sm { padding: 4px 10px; font-size: 12px; }
.auto-box {
  border: 1px dashed var(--line); border-radius: 14px; padding: 10px 12px; margin: 8px 0; background: var(--surface-2);
}
.auto-box .ab-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.auto-box .ab-h button { margin-left: auto; }
.auto-box dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
.auto-box dt { color: var(--ink-3); font-weight: 600; }
.auto-box dd { margin: 0; font-weight: 600; word-break: break-all; }
.collapse-btn { border: 0; background: none; color: var(--blue); font-weight: 700; font-size: 14px; padding: 6px 0; }
details.more { margin: 8px 0; }
details.more summary { cursor: pointer; font-weight: 700; color: var(--ink-2); font-size: 14px; padding: 8px 0; list-style: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }

/* ---------- bags ---------- */
.bag-card { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.bag-photo { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: var(--surface-2); display: block; }
.bag-photo.none { display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 28px; }
.bag-main { min-width: 0; }
.bag-top { display: flex; align-items: center; gap: 8px; }
/* luggage tag — the signature element of the bag section */
.ltag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--amber); color: #fff; font-weight: 800; font-variant-numeric: tabular-nums;
  padding: 4px 10px 4px 8px; border-radius: 6px 10px 10px 6px; font-size: 15px; letter-spacing: .02em;
  position: relative; flex: none;
}
.ltag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.25); }
.ltag.big { font-size: 22px; padding: 6px 14px 6px 10px; }
.bag-owner { font-weight: 700; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bag-part { color: var(--ink-3); font-size: 12px; font-weight: 600; }
.bag-items { margin: 6px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.bag-items li b { color: var(--ink); font-weight: 700; }
.bag-items .more { color: var(--ink-3); }
.photo-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
.photo-strip::-webkit-scrollbar { display: none; }
.photo-strip .ph { position: relative; flex: none; }
.photo-strip img { width: 112px; height: 112px; object-fit: cover; border-radius: 12px; display: block; background: var(--surface-2); }
.photo-strip .del { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); background: var(--red); color: #fff; font-size: 13px; }
.photo-strip .add { width: 112px; height: 112px; border-radius: 12px; border: 2px dashed var(--line); background: none; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; gap: 2px; }
.photo-strip .add span { font-size: 26px; }
.items-edit { display: flex; flex-direction: column; gap: 6px; }
.item-line { display: grid; grid-template-columns: 1fr 72px 60px 36px; gap: 6px; align-items: center; }
.item-line input { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 42px; font-size: 15px; outline: none; width: 100%; background: var(--surface); }
.item-line input:focus { border-color: var(--amber); }
.item-line .rm { border: 0; background: var(--surface-2); color: var(--ink-2); border-radius: 10px; height: 42px; }
.quick-add { display: flex; gap: 6px; margin-top: 6px; }
.quick-add input { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; outline: none; background: var(--surface); }
.quick-add input:focus { border-color: var(--amber); }
.bag-detail-photos img { width: 100%; border-radius: 14px; display: block; margin-bottom: 8px; }

/* ---------- more ---------- */
.menu { padding: 8px 14px; display: flex; flex-direction: column; gap: 8px; }
.menu .card { display: flex; align-items: center; gap: 12px; }
.menu .m-ic { font-size: 24px; width: 32px; text-align: center; }
.menu .m-t { font-weight: 700; }
.menu .m-d { color: var(--ink-2); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.stat span { font-size: 12px; color: var(--ink-2); font-weight: 600; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 14px; right: 14px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px); z-index: 40;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
}
.toast button { margin-left: auto; border: 0; background: none; color: var(--green); font-weight: 800; }
@media (prefers-color-scheme: dark) { .toast button { color: #8FE0C0; } }

/* ---------- team login ---------- */
.login-hero { text-align: center; padding: 18px 0 6px; }
.login-ic { width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 22px; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 38px; box-shadow: var(--shadow); }
.login-hero h2 { font-size: 24px; letter-spacing: -0.01em; }
.login-hero p { color: var(--ink-2); margin: 6px auto 0; max-width: 300px; font-size: 14px; line-height: 1.5; }
.pw-row { display: flex; gap: 8px; align-items: stretch; }
.pw-row input { flex: 1; min-width: 0; }
.pw-row .btn.sm { align-self: center; }
.btn.big { width: 100%; min-height: 52px; font-size: 17px; margin-top: 4px; }
.login-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; margin-top: 14px; }
.login-links .btn.ghost { min-height: 40px; font-size: 14px; }
.invite-id { text-align: center; padding: 14px; border-radius: 14px; background: var(--green-soft); margin: 4px 0 6px; }
.invite-id b { font-size: 28px; letter-spacing: .02em; color: var(--green-ink); }

/* ---------- iOS "add to home screen" hint ---------- */
.install-hint {
  margin: calc(8px + env(safe-area-inset-top)) 14px 0;
  background: var(--green-soft, var(--surface-2)); color: var(--ink); border: 1px solid var(--line); padding: 10px 10px 10px 14px; border-radius: 12px;
  display: flex; align-items: center; gap: 10px; font-size: 14px;
}
.install-hint + .view .topbar { padding-top: 10px; }
.install-hint > div { flex: 1; min-width: 0; }
.install-hint .iconbtn { width: 36px; height: 36px; flex: none; }

/* ---------- OCR overlay ---------- */
.ocr-wrap { display: flex; justify-content: center; background: #000; border-radius: 12px; overflow: hidden; }
.ocr-stage { position: relative; display: inline-block; line-height: 0; touch-action: none; }
.ocr-stage img { display: block; max-width: 100%; max-height: 46vh; width: auto; height: auto; }
.ocr-status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); min-height: 22px; margin: 2px 0 4px; }
.ocr-status.done { color: var(--ink); }
.ocr-box { position: absolute; border: 2px solid #FFD54A; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border-radius: 4px; }
.ocr-box .hdl { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: #FFD54A; transform: translate(-50%, -50%); }
.ocr-lines { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.ocr-line { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; font-size: 16px; font-weight: 600; }
.ocr-line.best { border-color: var(--green); background: var(--green-soft); }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; background: var(--green); width: 0; transition: width .2s; }

.lot-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.lot-row .lot-q { font-weight: 800; font-size: 18px; text-align: right; }
.lot-row .lot-q small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* ---------- sync status pill ---------- */
.sync-pill {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.sync-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync-pill.ok::before { background: var(--green); }
.sync-pill.busy::before { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
.sync-pill.err { color: var(--red); border-color: var(--red); }

@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sync-pill.busy::before { animation: none; } }

function parseItemLine(s) {
  s = String(s || '').trim().replace(/\s+/g, ' ');
  if (!s) return null;
  var t = s.split(' ');
  var last = t[t.length - 1];
  var m;
  if (t.length >= 2 && /^\d[\d,]*$/.test(last)) return { name: t.slice(0, -1).join(' '), qty: toNum(last), unit: '' };
  if (t.length >= 3 && /^\d[\d,]*$/.test(t[t.length - 2]) && /^[가-힣a-zA-Z]+$/.test(last)) return { name: t.slice(0, -2).join(' '), qty: toNum(t[t.length - 2]), unit: last };
  if (t.length >= 2 && (m = last.match(/^(\d[\d,]*)([가-힣a-zA-Z]+)$/))) return { name: t.slice(0, -1).join(' '), qty: toNum(m[1]), unit: m[2] };
  if (t.length >= 2 && /\d/.test(last) && /[xX×TCEA개포곽]/.test(last)) return { name: t.slice(0, -1).join(' '), qty: null, unit: last };
  return { name: s, qty: null, unit: '' };
}

    footer: function (c) {
      c.foot.appendChild(h('button', { class: 'btn', id: 'ocr-manual', onclick: function () { c.close(); openAddSheet({}, { mode: 'add' }); } }, '직접 입력'));
      c.foot.appendChild(h('button', { class: 'btn primary', id: 'ocr-go', onclick: runOcr }, engine === 'mlkit' ? '다시 인식' : '글자 인식'));
    },
    onClose: function () { scheduleOcrRelease(); }
  });
  function layoutBox() {
    var r = stage.getBoundingClientRect();
    boxEl.style.left = (box.x * r.width) + 'px'; boxEl.style.top = (box.y * r.height) + 'px';
    boxEl.style.width = (box.w * r.width) + 'px'; boxEl.style.height = (box.h * r.height) + 'px';
  }
  function setupDrag() {
    var mode = null, start = null, orig = null;
    function pt(e) { var t = e.touches ? e.touches[0] : e; var r = stage.getBoundingClientRect(); return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height }; }
    function down(e) {
      var p = pt(e); orig = { x: box.x, y: box.y, w: box.w, h: box.h }; start = p;
      var nearCorner = Math.abs(p.x - (box.x + box.w)) < 0.08 && Math.abs(p.y - (box.y + box.h)) < 0.08;
      var inside = p.x >= box.x && p.x <= box.x + box.w && p.y >= box.y && p.y <= box.y + box.h;
      mode = nearCorner ? 'resize' : (inside && !(box.w === 1 && box.h === 1) ? 'move' : 'draw');
      if (mode === 'draw') { box = { x: p.x, y: p.y, w: 0, h: 0 }; }
      e.preventDefault();
    }
    function move(e) {
      if (!mode) return; var p = pt(e); var dx = p.x - start.x, dy = p.y - start.y;
      if (mode === 'move') { box.x = Math.min(Math.max(0, orig.x + dx), 1 - orig.w); box.y = Math.min(Math.max(0, orig.y + dy), 1 - orig.h); }
      else if (mode === 'resize') { box.w = Math.min(Math.max(0.05, orig.w + dx), 1 - box.x); box.h = Math.min(Math.max(0.05, orig.h + dy), 1 - box.y); }
      else { var x0 = Math.min(start.x, p.x), y0 = Math.min(start.y, p.y); box = { x: Math.max(0, x0), y: Math.max(0, y0), w: Math.min(Math.abs(p.x - start.x), 1 - x0), h: Math.min(Math.abs(p.y - start.y), 1 - y0) }; }
      layoutBox(); e.preventDefault();
    }
    function up() { if (mode === 'draw' && (box.w < 0.05 || box.h < 0.03)) { box = full; layoutBox(); } mode = null; }
    stage.addEventListener('touchstart', down, { passive: false }); stage.addEventListener('touchmove', move, { passive: false }); stage.addEventListener('touchend', up);
    stage.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  }
  function runOcr() {
    if (busy) return; busy = true;
    var go = qs('#ocr-go'); if (go) go.disabled = true;
    var status = qs('#ocr-status'), prog = qs('#ocr-prog i');
    function onStatus(msg, p, done) {
      if (status) { status.innerHTML = ''; if (!done) status.appendChild(h('span', { class: 'spinner' })); status.appendChild(h('span', null, msg)); status.className = 'ocr-status' + (done ? ' done' : ''); }
      if (prog && p != null) prog.style.width = Math.round(p * 100) + '%';
    }
    var linesWrap = qs('#ocr-lines'); if (linesWrap) linesWrap.innerHTML = '';
    onStatus('글자 인식 준비 중…', 0.05);
    var run = engine === 'mlkit' ? recognizeNative(canvas, box, onStatus) : recognizeTesseract(canvas, box, onStatus);
    run.then(function (items) {
      if (prog) prog.style.width = '100%';
      var lines = rankOcrLines(items);
      var found = extractFacts(items);
      // facts accumulate over re-recognitions of the same photo: cropping to the name must not lose the date read earlier
      if (found.expiry && session.dismissed.expiry !== found.expiry.value) session.expiry = found.expiry;
      if (found.pack && session.dismissed.pack !== found.pack.value + found.pack.unit) session.pack = found.pack;
      if (lines.length) session.lines = lines;
      var wrap = qs('#ocr-lines'); if (!wrap) return; wrap.innerHTML = '';
      ctx.body.scrollTop = 0;
      function photoPromise() {
        if (!session.photoPromise) session.photoPromise = new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', 0.85); }).then(function (b) { return b ? uploadPhoto(b) : ''; }).catch(function () { return ''; });
        return session.photoPromise;
      }
      function handoff() { return { expiry: session.expiry ? session.expiry.value : '', packUnit: session.pack ? session.pack.value : null, photoPromise: photoPromise() }; }
      function go(name) { UI.ocrPrefill = handoff(); ctx.close(); UI.query = name; UI.tab = 'drugs'; render(); runSearch(true); }
      var facts = h('div', { class: 'chips', style: 'margin-bottom:6px' });
      if (session.expiry) facts.appendChild(h('button', { class: 'chip on', title: session.expiry.source, onclick: function () { session.dismissed.expiry = session.expiry.value; session.expiry = null; facts.removeChild(this); toast('유효기간 자동 입력을 껐어요'); } }, '📅 유효기간 ' + session.expiry.value + ' 자동 입력 ✕'));
      if (session.pack) facts.appendChild(h('button', { class: 'chip on', title: session.pack.source, onclick: function () { session.dismissed.pack = session.pack.value + session.pack.unit; session.pack = null; facts.removeChild(this); } }, '📦 포장단위 ' + session.pack.value + session.pack.unit + ' ✕'));
      facts.appendChild(h('span', { class: 'chip', style: 'border-style:dashed' }, '📷 사진 함께 저장'));
      wrap.appendChild(facts);
      if (!lines.length) {
        onStatus('이 영역에서는 글자를 찾지 못했어요. 상자를 이름 부분에 더 가깝게 맞추거나 "전체"로 다시 인식해 보세요.', 1, true);
        lines = session.lines || [];
        if (lines.length) wrap.appendChild(h('div', { class: 'muted', style: 'font-size:12px;margin:4px 0' }, '이전에 읽은 후보'));
      } else onStatus('인식된 글자 — 약 이름을 누르면 바로 검색해요', 1, true);
      lines.slice(0, 8).forEach(function (l, i) {
        wrap.appendChild(h('button', { class: 'ocr-line' + (i === 0 ? ' best' : ''), onclick: function () { go(l); } }, l));
      });
      wrap.appendChild(h('div', { class: 'quick-add' },
        h('input', { placeholder: '인식이 틀렸으면 직접 고쳐서 검색', value: lines[0] || '', id: 'ocr-fix' }),
        h('button', { class: 'btn primary', style: 'min-height:46px', onclick: function () { var v = qs('#ocr-fix').value.trim(); if (!v) return; go(v); } }, '검색')));
      var manual = qs('#ocr-manual'); if (manual) manual.onclick = function () { UI.ocrPrefill = handoff(); ctx.close(); openAddSheet({ name: lines[0] || '' }, { mode: 'add' }); };
    }).catch(function (e) {
      var msg = String(e && e.message || e);
      OCR_LAST_ERROR = msg;
      ctx.body.scrollTop = 0;
      onStatus('인식 실패: ' + msg + ' — 더보기 → 진단 정보에서 자세히 볼 수 있어요', 1, true);
    }).then(function () { busy = false; if (go) go.disabled = false; });
  }
}

// items: [{text, conf, hRel}] → ranked unique strings, product-name-like first
function rankOcrLines(items) {
  var seen = {}, out = [];
  var maxH = 0; items.forEach(function (it) { if (it.hRel > maxH) maxH = it.hRel; });
  items.forEach(function (it) {
    var l = String(it.text || '').replace(/[^ㄱ-ㆎ가-힣a-zA-Z0-9.\/\-+ ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!l) return;
    var han = (l.match(/[가-힣]/g) || []).length, lat = (l.match(/[a-zA-Z]/g) || []).length, jamo = (l.match(/[ㄱ-ㆎ]/g) || []).length;
    if (han + lat < 2) return;
    if (l.length > 40) l = l.slice(0, 40);
    var compact = l.replace(/\s+/g, '');
    var score = Math.min(16, han * 2) + Math.min(10, lat) - jamo * 3 + (it.conf || 0) / 12;
    if (maxH > 0 && it.hRel) score += 10 * (it.hRel / maxH); // the biggest print on a box is usually the product name
    var core = compact.replace(/\d+(\.\d+)?(mg|g|ml|mL|%|밀리그램|mcg|㎎|㎖)$/i, '');
    if (/(정|캡슐|서방정|시럽|크림|연고|액|캅셀|산|과립|주|겔|로션|패취|패치|세립|현탁액|점안액|좌제)$/.test(core)) score += 8;
    if (compact.length >= 3 && compact.length <= 12) score += 4;
    if (compact.length > 20) score -= 4;
    if (/(산염|염산|나트륨|수화물|칼륨|칼슘|마그네슘|트륨)/.test(compact) && compact.length > 8) score -= 6; // ingredient line, not a product name
    if (/^(제조|수입|유효|사용|보관|성분|함량|전문|일반|의약품|주식회사|제약|\(주\)|Lot|LOT|EXP|제조번호|MADE|포장|저장|효능|용법|주의|식약처|KGMP|GMP)/i.test(l)) score -= 8;
    if (/^[A-Za-z0-9 .\/\-+]+$/.test(l) && !/(tab|cap|syr|inj|cream|mg)/i.test(l)) score -= 3; // latin-only noise
    var key = compact.toLowerCase();
    if (seen[key] !== undefined) { if (score > out[seen[key]].s) out[seen[key]].s = score; return; }
    seen[key] = out.length;
    out.push({ l: l, s: score });
  });
  out.sort(function (a, b) { return b.s - a.s; });
  return out.map(function (x) { return x.l; });
}

/* ---------------- expiry / pack detection from recognized lines ---------------- */
// Returns {expiry:{value,source}|null, pack:{value,unit,source}|null}. Dates near 사용기한/유효기간/EXP win; otherwise the latest plausible date.
function extractFacts(items) {
  var texts = items.map(function (it) { return String(it.text || ''); });
  var joined = texts.join('\n');
  var cands = [];
  function push(y, m, d, source, keyed) {
    y = Number(y); if (y < 100) y += 2000;
    m = m == null ? null : Number(m); d = d == null ? null : Number(d);
    if (y < 2020 || y > 2045) return;
    if (m != null && (m < 1 || m > 12)) return;
    if (d != null && (d < 1 || d > 31)) return;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var v = String(y) + (m != null ? '-' + pad(m) : '') + (d != null ? '-' + pad(d) : '');
    cands.push({ value: v, source: source.trim(), keyed: keyed, t: new Date(y, m != null ? m - 1 : 11, d != null ? d : 28).getTime() });
  }
  var keyRe = /(사용기한|유효기간|유통기한|유효기한|사용기간|EXP\.?|Exp\.?|exp\.?|EXPIRY|Expiry|Best before|BBE)/;
  texts.forEach(function (raw, idx) {
    var t = raw.replace(/[Oo]/g, function (ch, off) { var prev = raw[off - 1] || '', next = raw[off + 1] || ''; return /\d/.test(prev) || /\d/.test(next) ? '0' : ch; }); // O→0 inside number groups
    var keyed = keyRe.test(t) || (idx > 0 && keyRe.test(texts[idx - 1]) && !/\d{4}/.test(texts[idx - 1]));
    var m, re;
    re = /(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?/g;  // 2027.09.18 / 2027-9-18 / 2027년 9월 18일
    while ((m = re.exec(t))) push(m[1], m[2], m[3], raw, keyed);
    re = /(20\d{2})\s*[.\-\/년]\s*(\d{1,2})(?![\d.\-\/])\s*월?/g;                     // 2027.09 / 2027-09
    while ((m = re.exec(t))) push(m[1], m[2], null, raw, keyed);
    re = /(?:^|[^\d])(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(?!\d)/g;                  // 20270918
    while ((m = re.exec(t))) push(m[1], m[2], m[3], raw, keyed);
    re = /(?:^|[^\d])(2[0-9])\s*[.\-\/]\s*(\d{2})\s*[.\-\/]\s*(\d{2})(?!\d)/g;        // 27.09.18 (only trusted next to a keyword)
    while ((m = re.exec(t))) if (keyed) push(m[1], m[2], m[3], raw, true);
  });
  var expiry = null;
  if (cands.length) {
    var keyedC = cands.filter(function (c) { return c.keyed; });
    var pool = keyedC.length ? keyedC : cands;
    pool.sort(function (a, b) { return b.t - a.t; });
    expiry = { value: pool[0].value, source: pool[0].source };
  }
  var pack = null, pm;
  var packRe = /(?:^|[^\d.])(\d{1,4})\s*(정|캡슐|캅셀|포|매|앰플|바이알|mL|ml|㎖)(?![a-zA-Z가-힣])/g;
  var best = null;
  texts.forEach(function (raw) {
    while ((pm = packRe.exec(raw))) {
      var n = Number(pm[1]); if (!n || n > 5000) continue;
      var unit = pm[2].replace('㎖', 'mL').replace('ml', 'mL');
      var score = (/정|캡슐|캅셀|포/.test(unit) ? 2 : 1) + (/함량|분량|중/.test(raw) ? -3 : 0);
      if (!best || score > best.score) best = { value: n, unit: unit, source: raw.trim(), score: score };
    }
  });
  if (best && best.score > 0) pack = best;
  return { expiry: expiry, pack: pack, text: joined };
}

/* main.js — router + startup */
'use strict';

function render() {
  var root = qs('#view');
  qsa('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === UI.tab); });
  if (UI.tab === 'drugs') renderDrugs(root);
  else if (UI.tab === 'bags') renderBags(root);
  else renderMore(root);
  window.scrollTo(0, 0);
}

// iPhone: the web version becomes an app through Safari's "홈 화면에 추가"; home-screen apps keep their own storage,
// so the hint is shown while the page still runs inside Safari.
function showInstallHint() {
  if (MODE !== 'web' || !isIos() || isStandalone()) return;
  try { if (localStorage.getItem('medkit.installHint') === 'x') return; } catch (e) { }
  var bar = h('div', { class: 'install-hint', role: 'status' },
    h('div', null, h('b', null, '홈 화면에 추가하면 앱처럼 써요'), h('div', { class: 'muted', style: 'font-size:12px' }, 'Safari 아래 공유 버튼(⬆︎) → "홈 화면에 추가"')),
    h('button', { class: 'iconbtn', 'aria-label': '닫기', onclick: function () { bar.remove(); try { localStorage.setItem('medkit.installHint', 'x'); } catch (e) { } } }, '✕'));
  var app = qs('#app'); app.insertBefore(bar, app.firstChild);
}

document.addEventListener('DOMContentLoaded', function () {
  qsa('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      if (UI.tab === t.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      UI.tab = t.dataset.tab; UI.ocrPrefill = null; render();
    });
  });
  loadDb().then(function () {
    render();
    if (MODE === 'web' && !syncConfigured() && !sessionStorage.getItem('medkit.previewNotice')) {
      try { sessionStorage.setItem('medkit.previewNotice', '1'); } catch (e) { }
      toast('팀 초대 링크로 열거나 더보기 › 팀 공유 연결하기를 하면 검색과 공유가 켜져요');
    }
    if (MODE === 'gas' || (MODE === 'web' && syncConfigured() && !DB.settings.sync.name)) {
      remoteCall('ping', {}).then(function (p) { if (p && p.ok) { DB.settings.sync.name = p.name || ''; DB.settings.sync.sheetUrl = p.sheetUrl || ''; save(); if (UI.joinedViaLink) { toast('팀에 연결됐어요: ' + (p.name || '공유 시트')); UI.joinedViaLink = false; render(); } } }).catch(function () { });
    }
    if (syncConfigured()) { syncNow({}); startPeriodicSync(); }
    if (MODE === 'web' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    }
    syncTeamToLocation();
    showInstallHint();
    ensureLogin();
  });
  window.addEventListener('pagehide', function () { clearTimeout(saveTimer); flushSave(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { clearTimeout(saveTimer); flushSave(); }
    else if (syncConfigured() && Date.now() - SYNC.lastOk > 20000) syncNow({});
  });
  window.addEventListener('online', function () { if (syncConfigured()) syncNow({}); });
});
